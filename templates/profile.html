{% extends 'base.html' %}
{% block title %}Profile — Roamory{% endblock %}
{% block content %}
<main class="page-shell account-page"><section class="account-editorial"><div class="profile-photo">{% if g.user['avatar_filename'] %}<img src="{{ url_for('static', filename='uploads/' + g.user['avatar_filename']) }}" alt="Profile photo">{% else %}<span>{{ g.user['full_name'][0]|upper }}</span>{% endif %}<i class="passport-ring"></i></div><div><span class="eyebrow">TRAVELLER PROFILE</span><h1>{{ g.user['full_name'] }}</h1><p>{{ g.user['email'] }}</p></div></section><form method="post" enctype="multipart/form-data" class="paper-form account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" value="{{ g.user['full_name'] }}" required></label><label>Email<input value="{{ g.user['email'] }}" disabled><small>Email changes are intentionally omitted in this student build.</small></label><label class="upload-drop">Profile image<input type="file" name="avatar" accept="image/png,image/jpeg,image/webp"><small>JPG, PNG or WEBP · max 8 MB</small></label><button class="button button-primary" type="submit">Save profile</button></form></main>
{% endblock %}
