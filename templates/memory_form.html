{% extends 'base.html' %}
{% block title %}Edit Memory — Roamory{% endblock %}
{% block content %}
{% include '_trip_nav.html' %}
<main class="page-shell trip-page form-page"><section class="form-editorial-header"><span class="eyebrow">JOURNAL PAGE</span><h1>Edit the memory.</h1></section><form method="post" enctype="multipart/form-data" class="paper-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="full">Title<input name="title" value="{{ memory['title'] }}" required></label><label>Date<input type="date" name="memory_date" value="{{ memory['memory_date'] or '' }}"></label><label>Location<input name="location" value="{{ memory['location'] or '' }}"></label><label class="full">Memory<textarea name="note" rows="5">{{ memory['note'] or '' }}</textarea></label><label>Mood<select name="mood">{% for value,label in [('postcard','Postcard blue'),('sunset','Sunset coral'),('lemon','Lemon yellow'),('lake','Lake turquoise')] %}<option value="{{ value }}" {{ 'selected' if memory['mood']==value else '' }}>{{ label }}</option>{% endfor %}</select></label><label class="upload-drop">Replace photograph<input type="file" name="image" accept="image/png,image/jpeg,image/webp"><small>Leave blank to keep the current image.</small></label></div><div class="form-footer"><a class="button button-secondary" href="{{ url_for('journal', trip_id=trip['id']) }}">Cancel</a><button class="button button-primary" type="submit">Save page</button></div></form></main>
{% endblock %}
