{% extends 'base.html' %}
{% block title %}Edit Document — Roamory{% endblock %}
{% block content %}
{% include '_trip_nav.html' %}
<main class="page-shell trip-page form-page"><section class="form-editorial-header"><span class="eyebrow">TRAVEL WALLET</span><h1>Edit the filed document.</h1><p>Replace the file only if the booking or ticket itself changed.</p></section><form method="post" enctype="multipart/form-data" class="paper-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="full">Title<input name="title" value="{{ document['title'] }}" required></label><label>Type<select name="type">{% for value in ['flight','train','bus','hotel','activity','reservation','identification','other'] %}<option value="{{ value }}" {{ 'selected' if document['type']==value else '' }}>{{ value|title }}</option>{% endfor %}</select></label><label>Date<input type="date" name="document_date" value="{{ document['document_date'] or '' }}"></label><label class="full">Note<textarea name="note" rows="4">{{ document['note'] or '' }}</textarea></label><label class="upload-drop full">Replace file<input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt"><small>Current: {{ document['original_filename'] }}</small></label></div><div class="form-footer"><a class="button button-secondary" href="{{ url_for('wallet', trip_id=trip['id']) }}">Cancel</a><button class="button button-primary" type="submit">Save document</button></div></form></main>
{% endblock %}
