{% extends 'base.html' %}
{% block title %}Edit Packing Item — Roamory{% endblock %}
{% block content %}
{% include '_trip_nav.html' %}
<main class="page-shell trip-page form-page"><section class="form-editorial-header"><span class="eyebrow">PACKING</span><h1>Edit this suitcase item.</h1></section><form method="post" class="paper-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="full">Item<input name="name" value="{{ item['name'] }}" required></label><label>Category<select name="category_id">{% for cat in categories %}<option value="{{ cat['id'] }}" {{ 'selected' if item['category_id']==cat['id'] else '' }}>{{ cat['name'] }}</option>{% endfor %}</select></label><label>Quantity<input type="number" min="1" name="quantity" value="{{ item['quantity'] }}"></label></div><div class="form-footer"><a class="button button-secondary" href="{{ url_for('packing', trip_id=trip['id']) }}">Cancel</a><button class="button button-primary" type="submit">Save item</button></div></form></main>
{% endblock %}
